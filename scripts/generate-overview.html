<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BewerbsBoard Overview Generator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: #050608;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      position: relative;
    }

    /* Ambient Background Glows */
    .bg-canvas {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 900px 400px at 50% 12%, rgba(225, 29, 72, 0.12), transparent 70%),
        radial-gradient(ellipse 800px 500px at 25% 65%, rgba(99, 102, 241, 0.08), transparent 70%),
        radial-gradient(ellipse 900px 600px at 60% 60%, rgba(14, 165, 233, 0.09), transparent 70%),
        radial-gradient(ellipse 600px 400px at 88% 50%, rgba(245, 158, 11, 0.07), transparent 70%),
        linear-gradient(180deg, #07090e 0%, #030406 100%);
      z-index: 1;
    }

    /* Subtle Studio Floor Grid / Reflection */
    .bg-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 380px;
      background: radial-gradient(ellipse 1400px 200px at 50% 100%, rgba(255, 255, 255, 0.03), transparent 80%);
      z-index: 1;
    }

    .main-container {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 42px 60px 40px 60px;
    }

    /* Top Branding */
    .header {
      text-align: center;
      margin-bottom: 24px;
      z-index: 20;
    }

    .header h1 {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 255, 255, 0.15);
    }

    .header p {
      margin-top: 10px;
      font-size: 22px;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .header p .dot {
      color: #ef4444;
      margin: 0 10px;
      font-size: 20px;
      vertical-align: middle;
    }

    /* Stage Arrangement */
    .stage {
      position: relative;
      width: 1800px;
      height: 860px;
      perspective: 1600px;
    }

    /* 1. Laptop Mockup (Left) */
    .laptop-wrapper {
      position: absolute;
      left: 15px;
      bottom: 35px;
      width: 660px;
      transform: perspective(1400px) rotateY(11deg) rotateX(3deg) rotateZ(-1deg);
      transform-style: preserve-3d;
      z-index: 12;
      filter: drop-shadow(0 35px 55px rgba(0, 0, 0, 0.88));
    }

    .laptop-screen-frame {
      background: #181a20;
      border: 3px solid #333842;
      border-radius: 18px 18px 0 0;
      padding: 10px 10px 14px 10px;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2);
    }

    .laptop-camera {
      width: 6px;
      height: 6px;
      background: #0d0f12;
      border: 1px solid #2a2e39;
      border-radius: 50%;
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
    }

    .laptop-screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      position: relative;
      border: 1px solid rgba(0, 0, 0, 0.5);
    }

    .laptop-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .laptop-base {
      width: 720px;
      height: 16px;
      background: linear-gradient(180deg, #2b303c 0%, #16181e 60%, #0d0e12 100%);
      margin-left: -30px;
      border-radius: 0 0 14px 14px;
      border-top: 1px solid #454c5e;
      position: relative;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.7);
    }

    .laptop-notch {
      width: 80px;
      height: 4px;
      background: #0d0e12;
      border-radius: 0 0 5px 5px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    /* 2. Mobile Phone Mockup (Front Center-Left) */
    .phone-wrapper {
      position: absolute;
      left: 360px;
      bottom: 25px;
      width: 245px;
      height: 510px;
      background: #15171d;
      border: 4px solid #333846;
      border-radius: 38px;
      padding: 6px;
      box-shadow: 
        0 40px 70px -10px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(255, 255, 255, 0.1),
        0 0 35px rgba(0, 0, 0, 0.8);
      z-index: 25;
      transform: perspective(1000px) rotateY(-2deg) rotateX(1deg);
    }

    .phone-speaker {
      width: 60px;
      height: 14px;
      background: #000000;
      border-radius: 10px;
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 32px;
      overflow: hidden;
      background: #0c0d11;
      position: relative;
      padding-top: 14px;
      box-sizing: border-box;
    }

    .phone-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* 3. TV / Monitor Display (Center) */
    .tv-wrapper {
      position: absolute;
      left: 590px;
      bottom: 48px;
      width: 820px;
      z-index: 15;
      filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.85));
    }

    .tv-frame {
      background: #16181f;
      border: 4px solid #2e3442;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.15),
        0 0 30px rgba(14, 165, 233, 0.12);
      position: relative;
    }

    .tv-screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(0, 0, 0, 0.6);
    }

    .tv-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tv-stand-neck {
      width: 96px;
      height: 48px;
      background: linear-gradient(180deg, #232733 0%, #13151c 100%);
      margin: 0 auto;
      border-left: 1px solid #3c4456;
      border-right: 1px solid #3c4456;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    .tv-stand-base {
      width: 340px;
      height: 14px;
      background: linear-gradient(180deg, #2b3140 0%, #151821 100%);
      margin: 0 auto;
      border-radius: 4px 4px 8px 8px;
      border-top: 1px solid #4b556b;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8);
    }

    /* 4. Theme Previews (Right Side) */
    .themes-sidebar {
      position: absolute;
      right: 20px;
      bottom: 60px;
      width: 390px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      z-index: 18;
    }

    .theme-card {
      background: #13151b;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      position: relative;
      transition: transform 0.2s ease;
    }

    .theme-card.theme-ceremony {
      border: 2px solid rgba(217, 119, 6, 0.45);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.75),
        0 0 25px rgba(217, 119, 6, 0.15);
    }

    .theme-card.theme-outdoor {
      border: 2px solid rgba(226, 232, 240, 0.35);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.75),
        0 0 25px rgba(255, 255, 255, 0.1);
    }

    .theme-card-screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
    }

    .theme-card-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="bg-floor"></div>

  <div class="main-container">
    <!-- Top Branding -->
    <header class="header">
      <h1>BewerbsBoard</h1>
      <p>Live results <span class="dot">•</span> Admin control <span class="dot">•</span> TV display</p>
    </header>

    <!-- Visual Showcase Stage -->
    <div class="stage">
      <!-- Laptop with Admin Dashboard (Left) -->
      <div class="laptop-wrapper">
        <div class="laptop-screen-frame">
          <div class="laptop-camera"></div>
          <div class="laptop-screen">
            <img src="../docs/images/admin-dashboard.png" alt="Admin Dashboard">
          </div>
        </div>
        <div class="laptop-base">
          <div class="laptop-notch"></div>
        </div>
      </div>

      <!-- Smartphone with Public Scoreboard (Front Left) -->
      <div class="phone-wrapper">
        <div class="phone-speaker"></div>
        <div class="phone-screen">
          <img src="../docs/images/public-scoreboard.png" alt="Public Mobile Scoreboard">
        </div>
      </div>

      <!-- TV Monitor with Broadcast Theme (Center) -->
      <div class="tv-wrapper">
        <div class="tv-frame">
          <div class="tv-screen">
            <img src="../docs/images/tv-scoreboard.png" alt="TV Scoreboard Broadcast Theme">
          </div>
        </div>
        <div class="tv-stand-neck"></div>
        <div class="tv-stand-base"></div>
      </div>

      <!-- Theme Cards (Right Side) -->
      <div class="themes-sidebar">
        <!-- Theme 2: Ceremony -->
        <div class="theme-card theme-ceremony">
          <div class="theme-card-screen">
            <img src="../docs/images/tv-scoreboard-theme-2.png" alt="TV Scoreboard Ceremony Theme">
          </div>
        </div>

        <!-- Theme 3: Outdoor -->
        <div class="theme-card theme-outdoor">
          <div class="theme-card-screen">
            <img src="../docs/images/tv-scoreboard-theme-3.png" alt="TV Scoreboard Outdoor Theme">
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

name: web-scoreboard-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - type: volume
        source: scoreboard-data
        target: /app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: 1
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "/app/server/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

volumes:
  scoreboard-data:
